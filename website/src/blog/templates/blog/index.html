{% extends 'blog/base.html' %}

{% block title %}<title>Le blog</title>{% endblock %}


{% block content %}

    <a href="{% url 'blog-post-create' %}">Ajouter un article</a>
{% for post in object_list %}
    <h1>{{post.title|safe}}</h1>
    {% for post in post %}
    <a href="{% url 'blog-post'  slug=post.slug %}">
        <h3>{{post.title}}</h3>
    </a>
{% endfor %}
{% endblock %}
